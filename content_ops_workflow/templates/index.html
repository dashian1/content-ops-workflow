<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>内容运营 Workflow</title>
  <style>
    :root {
      --bg: #f6f7f8;
      --panel: #ffffff;
      --text: #202124;
      --muted: #69707a;
      --line: #dfe3e8;
      --primary: #1f6feb;
      --primary-dark: #185abc;
      --soft: #eef4ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    h1 { font-size: 18px; margin: 0; }
    .meta { color: var(--muted); font-size: 13px; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
    }
    main {
      display: grid;
      grid-template-columns: 430px 1fr;
      gap: 16px;
      padding: 16px;
      min-height: calc(100vh - 58px);
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }
    .stack { display: grid; gap: 12px; align-content: start; }
    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 11px;
      font: inherit;
      background: #fff;
    }
    textarea { min-height: 92px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 6px;
      padding: 10px 13px;
      font: inherit;
      cursor: pointer;
    }
    button.primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    button.primary:hover { background: var(--primary-dark); }
    button:disabled { opacity: .6; cursor: wait; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .hint {
      padding: 10px;
      border-radius: 6px;
      background: var(--soft);
      color: #24436f;
      font-size: 13px;
      line-height: 1.55;
    }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 260px;
      margin: 0;
      line-height: 1.6;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
    }
    .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tabs button.active { background: #111827; color: white; }
    .output { display: none; }
    .output.active { display: block; }
    @media (max-width: 980px) {
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>内容运营 Workflow</h1>
    <div class="meta">
      <span class="badge" id="obsidianStatus">Obsidian 检查中</span>
      Obsidian：{{ obsidian_vault_name }} ｜ REST：{{ obsidian_rest_url }} ｜ 产品库：{{ product_kb_dir }}
    </div>
  </header>
  <main>
    <section class="stack">
      <div class="panel stack">
        <div class="hint">
          第一步由人选择爆款，不自动抓取。上传视频/截图或填写链接后，系统按运营维度拆解，再沉淀到 Obsidian。
        </div>
        <div class="row">
          <div>
            <label>标题 / 选题</label>
            <input id="title" placeholder="例如：一个爆款养生茶口播">
          </div>
          <div>
            <label>平台</label>
            <input id="platform" placeholder="抖音 / 小红书 / B站">
          </div>
        </div>
        <div>
          <label>链接</label>
          <input id="url" placeholder="可选，粘贴爆款链接">
        </div>
        <div>
          <label>数据</label>
          <input id="metrics" placeholder="点赞、收藏、评论、转发、播放等">
        </div>
        <div>
          <label>为什么选它</label>
          <textarea id="reason" placeholder="人工判断：为什么觉得它值得拆"></textarea>
        </div>
        <div>
          <label>口播 / 字幕</label>
          <textarea id="transcript" placeholder="可选，粘贴口播或字幕。没有也可以先分析结构。"></textarea>
        </div>
        <div>
          <label>备注</label>
          <textarea id="notes" placeholder="账号、人设、评论区观察、你想迁移的方向"></textarea>
        </div>
        <div>
          <label>上传素材</label>
          <input id="file" type="file">
        </div>
        <div class="actions">
          <button class="primary" id="analyzeBtn">分析并沉淀 Obsidian</button>
          <button id="productBtn">查看产品库</button>
          <button id="obsidianBtn">检查 Obsidian 插件</button>
        </div>
      </div>
      <div class="panel stack">
        <div>
          <label>脚本目标</label>
          <textarea id="scriptGoal" placeholder="例如：基于这条爆款结构，为灵芝茶生成一条30秒混剪口播脚本"></textarea>
        </div>
        <div class="actions">
          <button class="primary" id="scriptBtn">结合产品库出脚本并导出 loop</button>
          <button id="candidateBtn">生成多风格候选池</button>
        </div>
      </div>
      <div class="panel stack">
        <div class="hint">发布后把数据回填，系统会沉淀到 Obsidian 数据复盘库。</div>
        <div class="row">
          <div><label>候选ID/风格</label><input id="candidateId" placeholder="C01 / 猎奇"></div>
          <div><label>产品</label><input id="feedbackProduct" placeholder="承接产品"></div>
        </div>
        <div><label>视频链接</label><input id="videoUrl" placeholder="发布后链接"></div>
        <div class="row">
          <div><label>播放</label><input id="views"></div>
          <div><label>完播率</label><input id="completionRate"></div>
        </div>
        <div class="row">
          <div><label>点赞</label><input id="likes"></div>
          <div><label>评论</label><input id="comments"></div>
        </div>
        <div class="row">
          <div><label>收藏</label><input id="saves"></div>
          <div><label>转发</label><input id="shares"></div>
        </div>
        <div><label>转化/询单</label><input id="conversion"></div>
        <div><label>复盘备注</label><textarea id="feedbackNotes"></textarea></div>
        <div class="actions"><button id="feedbackBtn" class="primary">回填数据并复盘</button></div>
      </div>
    </section>
    <section class="panel">
      <div class="tabs">
        <button class="active" data-tab="analysis">爆款分析</button>
        <button data-tab="match">产品匹配</button>
        <button data-tab="candidates">候选池</button>
        <button data-tab="script">脚本 / Loop</button>
        <button data-tab="review">数据复盘</button>
        <button data-tab="paths">文件路径</button>
      </div>
      <pre id="analysis" class="output active"></pre>
      <pre id="match" class="output"></pre>
      <pre id="candidates" class="output"></pre>
      <pre id="script" class="output"></pre>
      <pre id="review" class="output"></pre>
      <pre id="paths" class="output"></pre>
    </section>
  </main>
  <script>
    let lastAnalysis = '';
    let lastProductMatch = '';
    let lastFilePath = '';
    let lastPaths = {};
    let lastCandidates = [];
    const $ = id => document.getElementById(id);
    function values() {
      return {
        title: $('title').value.trim(),
        platform: $('platform').value.trim(),
        url: $('url').value.trim(),
        metrics: $('metrics').value.trim(),
        reason: $('reason').value.trim(),
        transcript: $('transcript').value.trim(),
        notes: $('notes').value.trim(),
        file_path: lastFilePath
      };
    }
    function output(id, text) { $(id).textContent = text || ''; }
    function setBusy(btn, busy) { btn.disabled = busy; }
    function formatPaths(paths) {
      lastPaths = paths || {};
      const lines = [];
      Object.entries(lastPaths).forEach(([key, value]) => {
        if (value && typeof value === 'object') {
          lines.push(`${key}:`);
          Object.entries(value).forEach(([k, v]) => lines.push(`  ${k}: ${v || ''}`));
        } else {
          lines.push(`${key}: ${value || ''}`);
        }
      });
      lines.push('');
      lines.push('可用 /api/obsidian/open 打开返回的 vault_path。');
      return lines.join('\n');
    }
    async function checkObsidian() {
      const res = await fetch('/api/obsidian/status');
      const j = await res.json();
      const status = $('obsidianStatus');
      status.textContent = j.mode === 'plugin' ? 'Obsidian 插件已连接' : 'Obsidian 文件模式';
      status.title = j.message || '';
      return j;
    }
    document.querySelectorAll('.tabs button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('active', x === btn));
        document.querySelectorAll('.output').forEach(x => x.classList.toggle('active', x.id === btn.dataset.tab));
      });
    });
    $('analyzeBtn').addEventListener('click', async () => {
      const btn = $('analyzeBtn');
      setBusy(btn, true);
      output('analysis', '正在分析爆款并写入 Obsidian...');
      const fd = new FormData();
      Object.entries(values()).forEach(([k, v]) => fd.append(k, v));
      if ($('file').files[0]) fd.append('file', $('file').files[0]);
      try {
        const res = await fetch('/api/analyze', {method: 'POST', body: fd});
        const j = await res.json();
        if (!j.ok) throw new Error(j.error || '分析失败');
        lastAnalysis = j.analysis || '';
        lastProductMatch = j.product_match || '';
        lastFilePath = j.file_path || '';
        output('analysis', lastAnalysis);
        output('match', lastProductMatch);
        if (j.video_package?.transcript && !$('transcript').value.trim()) $('transcript').value = j.video_package.transcript;
        output('paths', formatPaths(j.paths || {}));
      } catch (e) {
        output('analysis', e.message);
      } finally {
        setBusy(btn, false);
      }
    });
    $('scriptBtn').addEventListener('click', async () => {
      const btn = $('scriptBtn');
      setBusy(btn, true);
      output('script', '正在结合产品库生成脚本和 loop 表...');
      try {
        const res = await fetch('/api/generate-script', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({...values(), analysis: lastAnalysis, product_match: lastProductMatch, script_goal: $('scriptGoal').value.trim()})
        });
        const j = await res.json();
        if (!j.ok) throw new Error(j.error || '生成失败');
        output('script', j.script || '');
        output('paths', formatPaths(j.paths || {}));
      } catch (e) {
        output('script', e.message);
      } finally {
        setBusy(btn, false);
      }
    });
    $('candidateBtn').addEventListener('click', async () => {
      const btn = $('candidateBtn');
      setBusy(btn, true);
      output('candidates', '正在生成猎奇、反差、反反差、共鸣、避坑、教程、生活仪式候选...');
      try {
        const res = await fetch('/api/candidates', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({...values(), analysis: lastAnalysis, product_match: lastProductMatch, script_goal: $('scriptGoal').value.trim()})
        });
        const j = await res.json();
        if (!j.ok) throw new Error(j.error || '生成候选失败');
        lastCandidates = j.candidates?.candidates || [];
        output('candidates', JSON.stringify(j.candidates || {}, null, 2));
        output('paths', formatPaths(j.paths || {}));
        document.querySelector('[data-tab="candidates"]').click();
      } catch (e) {
        output('candidates', e.message);
      } finally {
        setBusy(btn, false);
      }
    });
    $('feedbackBtn').addEventListener('click', async () => {
      const btn = $('feedbackBtn');
      setBusy(btn, true);
      output('review', '正在生成数据复盘...');
      try {
        const [candidate_id, style] = $('candidateId').value.split('/').map(x => (x || '').trim());
        const res = await fetch('/api/feedback', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            title: $('title').value.trim(),
            platform: $('platform').value.trim(),
            video_url: $('videoUrl').value.trim(),
            candidate_id,
            style,
            product: $('feedbackProduct').value.trim(),
            template: '',
            audience: '',
            views: $('views').value.trim(),
            likes: $('likes').value.trim(),
            comments: $('comments').value.trim(),
            saves: $('saves').value.trim(),
            shares: $('shares').value.trim(),
            completion_rate: $('completionRate').value.trim(),
            conversion: $('conversion').value.trim(),
            notes: $('feedbackNotes').value.trim()
          })
        });
        const j = await res.json();
        if (!j.ok) throw new Error(j.error || '复盘失败');
        output('review', j.review || '');
        output('paths', formatPaths(j.paths || {}));
        document.querySelector('[data-tab="review"]').click();
      } catch (e) {
        output('review', e.message);
      } finally {
        setBusy(btn, false);
      }
    });
    $('productBtn').addEventListener('click', async () => {
      const res = await fetch('/api/product-library');
      const j = await res.json();
      output('paths', `产品库目录：${j.dir}\n\n${j.preview || ''}`);
      document.querySelector('[data-tab="paths"]').click();
    });
    $('obsidianBtn').addEventListener('click', async () => {
      const j = await checkObsidian();
      output('paths', JSON.stringify(j, null, 2));
      document.querySelector('[data-tab="paths"]').click();
    });
    checkObsidian().catch(() => {
      $('obsidianStatus').textContent = 'Obsidian 未连接';
    });
  </script>
</body>
</html>
